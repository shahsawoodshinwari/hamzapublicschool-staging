<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آف لائن - حمزہ پبلک سکول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      color: #ffb606;
    }
    p {
      color: #9ca3af;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .info {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .info h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #fff;
    }
    .info p {
      margin-bottom: 8px;
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      background: #ffb606;
      color: #1a1a1a;
      padding: 12px 32px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-en {
      display: inline-block;
      background: #fff;
      color: #1a1a1a;
      padding: 12px 32px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 12px;
      transition: opacity 0.2s;
    }
    .btn-en:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>آپ آف لائن ہیں</h1>
    <p>ایسا لگتا ہے کہ آپ کا انٹرنیٹ کنکشن کام نہیں کر رہا۔ کچھ معلومات اب بھی دستیاب ہیں:</p>
    
    <div class="info">
      <h2>حمزہ پبلک سکول</h2>
      <p><strong>پتہ:</strong> گاگرہ لنڈی کوتل، ضلع خیبر</p>
      <p><strong>فون:</strong> 0302-8171873</p>
      <p><strong>ای میل:</strong> info@hamzapublicschool.edu.pk</p>
    </div>
    
    <a href="/ur/" class="btn">اردو ہوم پر واپس جائیں</a>
    <br>
    <a href="/en/" class="btn-en">Go to English Home</a>
  </div>
</body>
</html>
